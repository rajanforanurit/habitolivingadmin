name: habitolivingadmin
description: "Habito Living — society admin app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- Shared code (models, services, UI, theme, config) --------------------
  # Lives in the habitoliving repo at packages/shared so the resident, admin
  # and guard apps all use one copy.
  habitoliving_shared:
    path: packages/shared

  # --- App-level only -------------------------------------------------------
  firebase_core: ^3.6.0
  url_launcher: ^6.3.0
  http: ^1.2.2

  # --- In-app updater (self-contained in lib/updates/, disabled) -----------
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    # UI typeface: Instrument Sans. Neutral grotesque with a slight humanist
    # warmth, used for every screen.
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    # Numeric/display face for figures, prices, invoice totals and the login
    # wordmark. Variable weight, so the full 400-800 range is available.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 400