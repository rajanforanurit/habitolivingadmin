name: habitoliving_shared
description: "Shared models, services, UI and config for the Habito Living apps (resident, admin, guard)."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- Backend API integration ---------------------------------------------
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.1.2
  shared_preferences: ^2.5.0

  # --- UI -------------------------------------------------------------------
  # Component library: shadcn/ui ported to Flutter.
  shadcn_flutter: ^0.0.55
  intl: ^0.19.0

  # --- Media: camera, image picker, document/file upload --------------------
  image_picker: ^1.1.2
  file_picker: ^10.1.2

  # --- Push notifications (FCM on Android, APNs on iOS via FCM) ------------
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # --- Ads + alarm audio ----------------------------------------------------
  google_mobile_ads: ^9.2.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true